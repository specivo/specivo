server_tokens off;

access_log /var/log/nginx/access.log;
error_log  /var/log/nginx/error.log;

# Gzip compression for text assets
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

# Prefer upstream X-Forwarded-Proto (from Caddy/Cloudflare) over $scheme.
# When nginx is behind an HTTPS terminator that already sets the header,
# $scheme is just "http" (the internal connection) and would clobber it.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Re-resolve upstream on every request via Docker's embedded DNS.
    # Without this, nginx caches the IP at startup and returns 502
    # after the api container is recreated with a new IP.
    resolver 127.0.0.11 valid=5s;
    set $upstream http://api:8000;

    # Static assets — cache CSS, JS, fonts (immutable vendor files)
    location /static/vendor/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/fonts/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/css/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location /static/js/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Attachments — NEVER cache (auth-gated, per-user visibility)
    location ~* /api/v[0-9]+/attachments/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        add_header Cache-Control "no-store, no-cache, must-revalidate, private";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Health check — restrict to internal Docker network
    location = /health {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # MCP — disable buffering for SSE streams (Server-Sent Events).
    # nginx buffers responses by default, which prevents SSE from streaming
    # the initial endpoint event to clients.  MCP Streamable HTTP and SSE
    # both need unbuffered output.
    #
    # X-Accel-Buffering: no tells upstream proxies (Caddy, Cloudflare) not
    # to buffer this response either.  Without it, an upstream HTTPS
    # terminator may still buffer SSE despite nginx forwarding chunks.
    location /mcp/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Streaming: disable buffering, no read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;

        # Tell upstream proxies (Caddy, Cloudflare) not to buffer either
        add_header X-Accel-Buffering no;
    }

    # Default — proxy to API
    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
