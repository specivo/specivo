access_log /var/log/nginx/access.log;
error_log  /var/log/nginx/error.log;

# Gzip compression for text assets
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Static assets — cache CSS, JS, fonts (immutable vendor files)
    location /static/vendor/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/fonts/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/css/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location /static/js/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Attachments — NEVER cache (auth-gated, per-user visibility)
    location ~* /api/v[0-9]+/attachments/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate, private";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Health check — restrict to internal Docker network
    location = /health {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Default — proxy to API
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
