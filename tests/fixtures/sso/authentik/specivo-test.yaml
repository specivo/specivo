# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# authentik seed for the SSO tests (docker-compose.sso-test.yml, profile
# "authentik"). Same logical content as ../keycloak/specivo-test-realm.json and
# ../seed.py. Every credential here is a fixed, public test value.
#
# Issuers (one per application in authentik):
#   confidential: http://localhost:8034/application/o/specivo-test/
#   public PKCE:  http://localhost:8034/application/o/specivo-test-public/
#
# Known differences from the Keycloak seed (authentik defaults, kept on purpose
# so the compatibility smoke sees them):
#   - the "groups" claim comes from the default profile scope mapping;
#   - the default scope mappings emit neither locale nor zoneinfo; sso-thai
#     carries its locale as the user attribute settings.locale only, which no
#     token shows;
#   - the default email scope mapping always sends email_verified: false, so
#     sso-unverified is seeded for parity of usernames only;
#   - "sub" is the hashed user id (64 hex characters), not a readable id.
#
# grant_types must be set explicitly: a provider created from a blueprint
# gets an empty list and authentik answers every authorization request with
# invalid_request. The back-channel logout_uri below targets the E2E server;
# tests/integration/sso_idp/test_sso_login_authentik.py repoints it at its
# own listener while it runs.
version: 1
metadata:
  name: Specivo SSO test
  labels:
    blueprints.goauthentik.io/description: Disposable seed for the Specivo SSO tests (test-only values)
entries:
  # Make sure the default flows exist before the providers reference them.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  # --- Groups -----------------------------------------------------------------
  - model: authentik_core.group
    id: group-users
    identifiers:
      name: specivo-users
    attrs:
      name: specivo-users
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: specivo-admins
    attrs:
      name: specivo-admins

  # --- Users (password for all: sso-test-password) ---------------------------
  - model: authentik_core.user
    identifiers:
      username: sso-member
    attrs:
      name: SSO Member User
      email: sso-member@example.com
      password: sso-test-password
      groups:
        - !KeyOf group-users
  - model: authentik_core.user
    identifiers:
      username: sso-admin
    attrs:
      name: SSO Admin User
      email: sso-admin@example.com
      password: sso-test-password
      groups:
        - !KeyOf group-users
        - !KeyOf group-admins
  - model: authentik_core.user
    identifiers:
      username: sso-outsider
    attrs:
      name: SSO Outsider User
      email: sso-outsider@example.com
      password: sso-test-password
      groups: []
  - model: authentik_core.user
    identifiers:
      username: sso-unverified
    attrs:
      name: SSO Unverified User
      email: sso-unverified@example.com
      password: sso-test-password
      groups:
        - !KeyOf group-users
  - model: authentik_core.user
    identifiers:
      username: sso-collide
    attrs:
      name: SSO Collide User
      # Same email as a local test user created with UserFactory(login="collide").
      email: collide@example.com
      password: sso-test-password
      groups:
        - !KeyOf group-users
  - model: authentik_core.user
    identifiers:
      username: sso-thai
    attrs:
      name: SSO Thai User
      email: sso-thai@example.com
      password: sso-test-password
      groups:
        - !KeyOf group-users
      attributes:
        settings:
          locale: th

  # --- Confidential client "specivo" -------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-confidential
    identifiers:
      name: specivo-test
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Empty when created from a blueprint (authentik 2026.x refuses every
      # authorization request then); the admin UI pre-ticks nearly all types.
      grant_types: [authorization_code]
      client_id: specivo
      client_secret: specivo-test-client-secret-not-a-real-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:9944/auth/oidc/authentik/callback/
        - matching_mode: strict
          url: http://testserver/auth/oidc/authentik/callback/
        - matching_mode: strict
          url: http://localhost:9944/login/?logged_out=1
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://testserver/login/?logged_out=1
          redirect_uri_type: logout
      # RS256 with the instance's self-signed key (without it authentik signs HS256).
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      # Back-channel logout to the E2E server on the host.
      logout_uri: http://host.docker.internal:9944/auth/oidc/authentik/backchannel-logout/
      logout_method: backchannel
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: specivo-test
    attrs:
      name: Specivo (test, confidential)
      provider: !KeyOf provider-confidential
      policy_engine_mode: any

  # --- Public PKCE client "specivo-public" -----------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-public
    identifiers:
      name: specivo-test-public
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      grant_types: [authorization_code]
      client_id: specivo-public
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:9944/auth/oidc/authentik/callback/
        - matching_mode: strict
          url: http://testserver/auth/oidc/authentik/callback/
        - matching_mode: strict
          url: http://localhost:9944/auth/oidc/authentik-public/callback/
        - matching_mode: strict
          url: http://testserver/auth/oidc/authentik-public/callback/
        - matching_mode: strict
          url: http://localhost:9944/login/?logged_out=1
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: specivo-test-public
    attrs:
      name: Specivo (test, public PKCE)
      provider: !KeyOf provider-public
      policy_engine_mode: any
