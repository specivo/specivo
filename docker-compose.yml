services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "${SPECIVO_PORT:-9933}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SPECIVO_DATA_DIR:-./specivo-data}/logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Runs once as root before the api: creates the app's directories in the
  # data directory (attachments, avatars, models, state, logs/app) and gives
  # them to the unprivileged user the app runs as (uid/gid 10001). The data
  # directory itself stays with root. Needed for installs whose files were
  # written by root; when nothing is to change it exits at once. Everything
  # else in this file runs as uid 10001.
  init-data:
    image: specivo/specivo:${SPECIVO_VERSION:-latest}
    user: "0:0"
    command: fix-permissions
    network_mode: none
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}:/app/data
    restart: "no"

  api:
    image: specivo/specivo:${SPECIVO_VERSION:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://specivo:specivo@db:5432/specivo}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-key-change-me-in-production-please}"
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}:/app/data
    depends_on:
      init-data:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      # GETs /health/ (behind STEALTH_PREFIX when set); see scripts/healthcheck.py.
      test: ["CMD", "specivo-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery-worker:
    image: specivo/specivo:${SPECIVO_VERSION:-latest}
    command: celery -A specivo.tasks worker --loglevel=info
    entrypoint: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://specivo:specivo@db:5432/specivo}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-key-change-me-in-production-please}"
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Runs only the tasks that use the embedding model (the EMBEDDING_QUEUE queue).
  # Each worker process that embeds loads its own copy of the model, so one
  # process by default keeps one copy in memory. Raise
  # EMBEDDING_WORKER_CONCURRENCY to embed faster at the cost of a copy per process.
  celery-embeddings:
    image: specivo/specivo:${SPECIVO_VERSION:-latest}
    command: >-
      celery -A specivo.tasks worker --loglevel=info
      --queues=${EMBEDDING_QUEUE:-embeddings}
      --concurrency=${EMBEDDING_WORKER_CONCURRENCY:-1}
      --hostname=embeddings@%h
    entrypoint: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://specivo:specivo@db:5432/specivo}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-key-change-me-in-production-please}"
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: specivo/specivo:${SPECIVO_VERSION:-latest}
    command: celery -A specivo.tasks beat --loglevel=info
    entrypoint: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://specivo:specivo@db:5432/specivo}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SECRET_KEY: "${SECRET_KEY:-dev-insecure-key-change-me-in-production-please}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}/postgresql:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specivo}
      POSTGRES_USER: ${POSTGRES_USER:-specivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specivo}
    command: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specivo} -d ${POSTGRES_DB:-specivo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${SPECIVO_DATA_DIR:-./specivo-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
