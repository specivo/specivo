name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check specivo/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: specivo_test
          POSTGRES_USER: specivo
          POSTGRES_PASSWORD: specivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specivo -d specivo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://specivo:specivo@localhost:5432/specivo_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras

      - name: Create PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          PGPASSWORD=specivo psql -h localhost -U specivo -d specivo_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov=specivo --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=0

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
