name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Built bundles under specivo/static/dist/ are committed. Fail if a source
      # change was committed without rebuilding (stale artifacts).
      - name: Verify committed bundles are up to date
        run: git diff --exit-code -- specivo/static/dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras
      - run: uv run ruff check specivo/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: specivo_test
          POSTGRES_USER: specivo
          POSTGRES_PASSWORD: specivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specivo -d specivo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://specivo:specivo@localhost:5432/specivo_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras

      - name: Create PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          PGPASSWORD=specivo psql -h localhost -U specivo -d specivo_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -m 'not e2e' --cov=specivo --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

  test-e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: specivo_test
          POSTGRES_USER: specivo
          POSTGRES_PASSWORD: specivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specivo -d specivo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://specivo:specivo@localhost:5432/specivo_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-for-hs256
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Create PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          PGPASSWORD=specivo psql -h localhost -U specivo -d specivo_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -m e2e -n 0 --ignore=tests/e2e/test_visual_regression.py --output=test-results/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
