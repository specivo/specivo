name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Contributions are merged into the release branch, so pull requests that
    # target it get the same checks as those that target main.
    branches: [main, "release/**"]
  workflow_call:

# Every job only checks out code and uploads artifacts, which needs no more
# than read access. When release.yml calls this workflow, it runs with these
# permissions too, never with the release job's write access.
permissions:
  contents: read

jobs:
  # Build check for the esbuild bundles. They are generated, never committed:
  # the test jobs below build their own copy, and the release image builds them
  # in the Dockerfile's frontend stage.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check bundle manifests were written
        run: test -s specivo/static/dist/js/manifest.json && test -s specivo/static/dist/css/manifest.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      # The stricter rules (complexity, bugbear, bandit, blind except, ...)
      # apply to new code; existing violations carry a noqa. See CONTRIBUTING.md.
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Layer contracts (import-linter)
        run: uv run lint-imports
      - name: Static source rules
        run: uv run python scripts/check_static_rules.py
      - name: Type check (mypy)
        run: uv run mypy specivo/
      # Informational: lists the functions above complexity grade C and the
      # modules with a low maintainability index. It never fails the build.
      - name: Complexity report (radon)
        if: always()
        run: |
          {
            echo "## Complexity report"
            echo '### Functions with cyclomatic complexity grade D or worse'
            echo '```'
            uv run radon cc specivo -n D -s --total-average
            echo '```'
            echo '### Modules with maintainability index grade B or worse'
            echo '```'
            uv run radon mi specivo -n B -s
            echo '```'
          } | tee complexity-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complexity-report
          path: complexity-report.md

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: specivo_test
          POSTGRES_USER: specivo
          POSTGRES_PASSWORD: specivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specivo -d specivo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://specivo:specivo@localhost:5432/specivo_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-for-hs256
      # Bundle-serving tests fail instead of skipping when the build is missing.
      SPECIVO_REQUIRE_BUNDLES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover compares against the pull request's base branch.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras

      # Bundles are not committed; build them before the web layer is tested.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundles
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

      - name: Create PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          PGPASSWORD=specivo psql -h localhost -U specivo -d specivo_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      # Serial tests share instance-wide state (settings, advisory locks) and
      # cannot run beside other xdist workers, so they get a pass of their own,
      # as in `make test`. Coverage from both passes is combined.
      - name: Run tests
        run: uv run pytest -m 'not serial and not e2e' --cov=specivo --cov-report=

      - name: Run serial tests
        run: uv run pytest -m 'serial and not e2e' -n 0 --cov=specivo --cov-append --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # New and changed lines in a pull request must be covered by tests.
      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 \
            --format "markdown:diff-cover.md"
          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

  test-e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: specivo_test
          POSTGRES_USER: specivo
          POSTGRES_PASSWORD: specivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specivo -d specivo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://specivo:specivo@localhost:5432/specivo_test
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-32-bytes-for-hs256
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras

      # Bundles are not committed; the browser tests need them built.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundles
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Create PostgreSQL extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          PGPASSWORD=specivo psql -h localhost -U specivo -d specivo_test -c "CREATE EXTENSION IF NOT EXISTS ltree; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -m e2e -n 0 --output=test-results/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Starts the default docker-compose.yml with an image built from this commit
  # and checks that the bundled nginx answers on the published port.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t specivo/specivo:ci-smoke .
      - name: Start the default stack
        env:
          SPECIVO_VERSION: ci-smoke
        run: docker compose up -d --wait --wait-timeout 300
      - name: nginx answers on the published port
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:9933/health/
      - name: Show container state and logs
        if: failure()
        env:
          SPECIVO_VERSION: ci-smoke
        run: |
          docker compose ps -a
          docker compose logs --tail 200
