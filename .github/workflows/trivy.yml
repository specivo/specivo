name: Trivy

# Report-only security scanning. Findings go to the repository's Security tab
# (code scanning) and never fail the run, so a newly published advisory does
# not break unrelated work. The blocking gate is the image scan in
# release.yml. Settings shared with local runs live in trivy.yaml; see
# docs/development/security-scanning.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:17 UTC: picks up advisories published since the last push.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Trivy binary installed by trivy-action. Keep in step with release.yml
  # and the local commands in docs/development/security-scanning.md.
  TRIVY_VERSION: v0.76.1

jobs:
  # Lockfiles (vulnerabilities), Dockerfile (misconfigurations) and the
  # committed tree (secrets).
  repository:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Upload to code scanning
        # Fork pull requests get a read-only token and cannot upload.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # The image users actually pull, rescanned weekly for new advisories in its
  # Debian and Python packages.
  published-image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # Only for trivy.yaml; the scan target is the pulled image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan specivo/specivo:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: docker.io/specivo/specivo:latest
          trivy-config: trivy.yaml
          scanners: vuln,secret
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-latest
