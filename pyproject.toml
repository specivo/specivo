[project]
name = "specivo"
version = "0.13.0"
description = "Your team's knowledge, finally findable. Self-hosted project tracking, wiki, and search that understands what you wrote."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "PyJWT[crypto]>=2.13.0",
    "python-multipart>=0.0.31",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "bcrypt>=5.0.0",
    "jsonschema>=4.26.0",
    "referencing>=0.37",
    "mcp[cli]>=2.3",
    "pgvector>=0.4.2",
    "jinja2>=3.1.6",
    "babel>=2.16",
    "markdown>=3.11.2",
    "pygments>=2.20.0",
    "pillow>=13.0.0",
    "nh3>=0.3.4",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "factory-boy>=3.3",
    "ruff>=0.17",
    "mypy>=1.13",
    "import-linter>=2.16",
    "diff-cover>=11.0.1",
    "radon>=6.0.1",
    "pre-commit>=4.7.0",
]

[tool.setuptools.packages.find]
include = ["specivo*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest-playwright>=0.6.2",
    "pytest-xdist>=3.8.0",
    "types-jsonschema>=4.26.0.20260324",
    "types-python-dateutil>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: Pure logic tests (no database)",
    "integration: API endpoint tests (requires database)",
    "service: Service layer tests (requires database)",
    "slow: Tests that take >5 seconds",
    "serial: Tests that cannot run under xdist (shared state like Redis rate limits)",
    "e2e: End-to-end browser tests (requires running server)",
    "sso_idp: Tests against the disposable IdP (make sso-idp-up)",
]
# loadfile, not worksteal: test modules define fixtures that insert rows with
# fixed unique keys (logins, project keys). Spreading one module's tests across
# workers lets two of them create those rows concurrently, and when the two
# transactions take the locks in opposite order Postgres aborts one with a
# deadlock. Keeping a module on a single worker removes the concurrency; files
# still run in parallel with each other, at the same total runtime.
addopts = "-v --tb=short --strict-markers -n auto --dist loadfile"
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:asyncpg",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# Code samples in Markdown docs are laid out by hand.
exclude = ["*.md"]

[tool.ruff.lint]
# Existing violations of the stricter rules are marked with `# noqa` (a
# ratchet): new code must comply, old code is fixed as it is touched. Remove
# a noqa when you fix the line; never add one to new code without a reason.
select = [
    "E", "F", "I", "N", "W", "UP",
    "B",       # bugbear: likely bugs
    "C90",     # mccabe cyclomatic complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # too many returns/branches/args/statements
    "ASYNC",   # blocking calls in async code
    "S",       # bandit security checks
    "BLE",     # blind except
    "SIM",     # simplifications
    "PERF",    # performance anti-patterns
    "PIE",
    "RET",
    "ARG",     # unused arguments
    "ERA",     # commented-out code
    "RUF100",  # unused noqa: keeps the ratchet tight as lines get fixed
]
ignore = [
    "RET505", "RET506", "RET507", "RET508",  # else-after-return style is a matter of taste
    "SIM117",  # nested with statements are often clearer than one long line
    "SIM114",  # merging if-arms builds long and/or chains that are harder to read
    "SIM300",  # flags comparisons with UPPER_CASE names that read naturally as written
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as calls in default arguments.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Form",
    "fastapi.File", "fastapi.Header", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Unused variables and PascalCase locals are common in test setup; tests use
# assert, fixed passwords and SQL, and need not meet the complexity limits.
"tests/**" = [
    "F841", "N806", "S", "ARG", "ERA", "C90", "PLR09", "BLE001", "PERF", "RET",
]
# Route handlers take auth dependencies (current_user, admin) for their side
# effect, so an unused argument there is the normal FastAPI pattern.
"specivo/{api,web,scim,mcp}/**" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true


[tool.importlinter]
root_package = "specivo"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Models do not depend on services or entry points"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["specivo.models"]
forbidden_modules = [
    "specivo.services", "specivo.tasks", "specivo.importers",
    "specivo.api", "specivo.web", "specivo.mcp", "specivo.scim", "specivo.cli", "specivo.main",
]
# Existing exceptions (models/__init__ imports these to register their ORM event
# listeners); do not add to this list.
ignore_imports = [
    "specivo.models -> specivo.services.entity_link_index",
    "specivo.models -> specivo.services.search_index_service",
]

[[tool.importlinter.contracts]]
name = "Services do not depend on entry points"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["specivo.services", "specivo.schemas"]
forbidden_modules = ["specivo.api", "specivo.web", "specivo.mcp", "specivo.scim", "specivo.cli", "specivo.main"]
# Existing exceptions; do not add to this list.
ignore_imports = [
    "specivo.services.email_change_service -> specivo.web.deps",
    "specivo.services.sso.flow -> specivo.web.deps",
]

[[tool.importlinter.contracts]]
name = "Core does not depend on entry points"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["specivo.core"]
forbidden_modules = ["specivo.api", "specivo.web", "specivo.mcp", "specivo.scim", "specivo.cli", "specivo.main"]
# Existing exception; do not add to this list.
ignore_imports = ["specivo.core.exceptions -> specivo.web.deps"]
