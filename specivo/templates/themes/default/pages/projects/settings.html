{% extends "base.html" %}

{% block title %}Settings - {{ project.name }} - Specivo{% endblock %}

{% block content %}
<div class="breadcrumbs">
  <a href="/">Home</a>
  <span class="sep">/</span>
  <a href="/projects">Projects</a>
  <span class="sep">/</span>
  <a href="/projects/{{ project.key }}">{{ project.name }}</a>
  <span class="sep">/</span>
  <span class="current">Settings</span>
</div>

<h1 style="font-family: var(--sp-font-display); font-size: var(--sp-font-size-xl); font-weight: 700; margin-bottom: var(--sp-space-lg);">Settings</h1>

<!-- Settings tabs -->
<div x-data="{ tab: 'general' }" style="margin-bottom: var(--sp-space-xl);">
  <div style="display: flex; gap: var(--sp-space-md); border-bottom: 1px solid var(--sp-border); margin-bottom: var(--sp-space-xl); padding-bottom: 0;">
    <button @click="tab = 'general'" :style="tab === 'general' ? 'border-bottom: 2px solid var(--sp-accent); color: var(--sp-text);' : 'color: var(--sp-text-muted);'" style="padding: var(--sp-space-sm) var(--sp-space-md); background: none; border: none; font-weight: 500; cursor: pointer;">General</button>
    <button @click="tab = 'members'" :style="tab === 'members' ? 'border-bottom: 2px solid var(--sp-accent); color: var(--sp-text);' : 'color: var(--sp-text-muted);'" style="padding: var(--sp-space-sm) var(--sp-space-md); background: none; border: none; font-weight: 500; cursor: pointer;">Members</button>
    <button @click="tab = 'modules'" :style="tab === 'modules' ? 'border-bottom: 2px solid var(--sp-accent); color: var(--sp-text);' : 'color: var(--sp-text-muted);'" style="padding: var(--sp-space-sm) var(--sp-space-md); background: none; border: none; font-weight: 500; cursor: pointer;">Modules</button>
  </div>

  <!-- General tab -->
  <div x-show="tab === 'general'" x-data="projectGeneralSettings({ name: {{ project.name | tojson }}, description: {{ (project.description or '') | tojson }}, projectKey: {{ project.key | tojson }} })">
    <div class="card" style="padding: var(--sp-space-lg); max-width: 600px;">
      <div class="form-group" style="margin-bottom: var(--sp-space-md);">
        <label class="form-label">Name</label>
        <input class="form-input" type="text" x-model="name">
      </div>
      <div class="form-group" style="margin-bottom: var(--sp-space-md);">
        <label class="form-label">Identifier</label>
        <input class="form-input" type="text" value="{{ project.identifier }}" disabled style="opacity: 0.6;">
      </div>
      <div class="form-group" style="margin-bottom: var(--sp-space-md);">
        <label class="form-label">Key</label>
        <input class="form-input" type="text" value="{{ project.key }}" disabled style="opacity: 0.6;">
      </div>
      <div class="form-group" style="margin-bottom: var(--sp-space-md);">
        <label class="form-label">Description</label>
        <textarea class="form-input" rows="4" x-model="description"></textarea>
      </div>
      <div x-show="message" class="flash" style="margin-bottom: var(--sp-space-md);" x-text="message"></div>
      <button class="btn btn-primary" @click="save()" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
    </div>
  </div>

  <!-- Members tab -->
  <div x-show="tab === 'members'" x-data="projectMembers({ members: {{ members | tojson }}, projectKey: {{ project.key | tojson }} })">
    <div class="card" style="padding: var(--sp-space-lg);">
      <h3 style="font-family: var(--sp-font-display); font-weight: 600; margin: 0 0 var(--sp-space-md) 0;">Project Members</h3>
      <table class="issue-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Roles</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="members.length === 0">
            <tr>
              <td colspan="3" style="text-align: center; padding: var(--sp-space-lg); color: var(--sp-text-muted);">No members.</td>
            </tr>
          </template>
          <template x-for="m in members" :key="m.user_id">
            <tr>
              <td>
                <span style="font-weight: 500;" x-text="m.display_name"></span>
                <span style="color: var(--sp-text-muted); font-size: var(--sp-font-size-xs);" x-text="'(' + m.login + ')'"></span>
              </td>
              <td x-text="m.roles.join(', ')"></td>
              <td>
                <button class="btn-sm danger" @click="removeMember(m.user_id)">Remove</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modules tab -->
  <div x-show="tab === 'modules'" x-data="projectModules({ modules: {{ modules | tojson }}, projectKey: {{ project.key | tojson }} })">
    <div class="card" style="padding: var(--sp-space-lg); max-width: 600px;">
      <h3 style="font-family: var(--sp-font-display); font-weight: 600; margin: 0 0 var(--sp-space-md) 0;">Enabled Modules</h3>
      <template x-for="(enabled, name) in modules" :key="name">
        <div style="display: flex; align-items: center; gap: var(--sp-space-sm); padding: var(--sp-space-sm) 0; border-bottom: 1px solid var(--sp-border);">
          <input type="checkbox" :checked="enabled" @change="toggleModule(name)" :disabled="saving" style="width: 18px; height: 18px;">
          <span style="font-weight: 500; text-transform: capitalize;" x-text="name.replace('_', ' ')"></span>
        </div>
      </template>
      <div x-show="message" class="flash" style="margin-top: var(--sp-space-md);" x-text="message"></div>
    </div>
  </div>
</div>
{% endblock %}
