{% extends "base.html" %}

{% block title %}Settings - Admin - {{ brand_name }}{% endblock %}

{% block content %}
<div class="breadcrumbs">
  <a href="/">Home</a>
  <span class="sep">/</span>
  <a href="/admin/">Admin</a>
  <span class="sep">/</span>
  <span class="current">Settings</span>
</div>

<h1 style="font-family: var(--sp-font-display); font-size: var(--sp-font-size-xl); font-weight: 700; margin-bottom: var(--sp-space-xl);">Settings</h1>

<div class="card" style="padding: var(--sp-space-lg);" x-data='adminSettings({{ settings | tojson }})'>
  <table class="issue-table">
    <thead>
      <tr>
        <th>Key</th>
        <th>Value</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <template x-if="Object.keys(items).length === 0">
        <tr>
          <td colspan="3" style="text-align: center; padding: var(--sp-space-xl); color: var(--sp-text-muted);">No settings configured.</td>
        </tr>
      </template>
      <template x-for="key in Object.keys(items)" :key="key">
        <tr>
          <td class="sp-mono-key" x-text="key"></td>
          <td>
            <span x-show="editingKey !== key" x-text="items[key] || ''" style="word-break: break-all;"></span>
            <input x-show="editingKey === key" x-model="editValue" class="form-input" style="font-size: var(--sp-font-size-sm); width: 100%;">
          </td>
          <td style="white-space: nowrap;">
            <template x-if="editingKey !== key">
              <button class="sp-btn-sm" @click="startEdit(key)">Edit</button>
            </template>
            <template x-if="editingKey === key">
              <span style="display: flex; gap: var(--sp-space-xs);">
                <button class="sp-btn-sm" @click="cancelEdit()">Cancel</button>
                <button class="sp-btn-sm" style="background: var(--sp-accent); color: var(--sp-accent-text);" @click="save(key)" :disabled="saving" x-text="saving ? 'Saving...' : 'Save'"></button>
              </span>
            </template>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
  <div x-show="message" style="margin-top: var(--sp-space-md); font-size: var(--sp-font-size-sm);" :style="{ color: messageError ? 'var(--sp-danger)' : 'var(--sp-success)' }" x-text="message"></div>
</div>
{% endblock %}
