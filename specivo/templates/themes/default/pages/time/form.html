{% extends "base.html" %}

{% block title %}Log Time - {{ project.name }} - Specivo{% endblock %}

{% block content %}
<div class="breadcrumbs">
  <a href="/">Home</a>
  <span class="sep">/</span>
  <a href="/projects/{{ project.key }}">{{ project.name }}</a>
  <span class="sep">/</span>
  <a href="/projects/{{ project.key }}/time-entries">Time Entries</a>
  <span class="sep">/</span>
  <span class="current">Log Time</span>
</div>

<h1 style="font-family: var(--sp-font-display); font-size: var(--sp-font-size-xl); font-weight: 700; margin-bottom: var(--sp-space-xl);">Log Time</h1>

<div class="card" style="padding: var(--sp-space-xl); max-width: 600px;">
  <form method="post" action="/api/v1/projects/{{ project.key }}/time-entries" style="display: flex; flex-direction: column; gap: var(--sp-space-lg);">
    <div>
      <label for="issue_id" style="font-size: var(--sp-font-size-sm); font-weight: 500; display: block; margin-bottom: var(--sp-space-xs);">Issue (optional)</label>
      <input type="text" id="issue_id" name="issue_id" placeholder="e.g. {{ project.key }}-1" class="input" style="width: 100%;">
    </div>

    <div>
      <label for="hours" style="font-size: var(--sp-font-size-sm); font-weight: 500; display: block; margin-bottom: var(--sp-space-xs);">Hours *</label>
      <input type="number" id="hours" name="hours" step="0.25" min="0.25" required class="input" style="width: 100%; font-family: var(--sp-font-mono, 'JetBrains Mono', monospace);">
    </div>

    <div>
      <label for="activity_id" style="font-size: var(--sp-font-size-sm); font-weight: 500; display: block; margin-bottom: var(--sp-space-xs);">Activity *</label>
      <select id="activity_id" name="activity_id" required class="input" style="width: 100%;">
        <option value="">Select activity...</option>
        {% for a in activities %}
        <option value="{{ a.id }}" {{ 'selected' if a.is_default else '' }}>{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="spent_on" style="font-size: var(--sp-font-size-sm); font-weight: 500; display: block; margin-bottom: var(--sp-space-xs);">Date *</label>
      <input type="date" id="spent_on" name="spent_on" required class="input" style="width: 100%;">
    </div>

    <div>
      <label for="comments" style="font-size: var(--sp-font-size-sm); font-weight: 500; display: block; margin-bottom: var(--sp-space-xs);">Comments</label>
      <textarea id="comments" name="comments" rows="3" class="input" style="width: 100%; resize: vertical;"></textarea>
    </div>

    <div style="display: flex; align-items: center; gap: var(--sp-space-sm);">
      <input type="checkbox" id="is_billable" name="is_billable">
      <label for="is_billable" style="font-size: var(--sp-font-size-sm);">Billable</label>
    </div>

    <div style="display: flex; gap: var(--sp-space-md); justify-content: flex-end;">
      <a href="/projects/{{ project.key }}/time-entries" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Log Time</button>
    </div>
  </form>
</div>
{% endblock %}
